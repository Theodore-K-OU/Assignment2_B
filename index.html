<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="with=device-with, inial-scale=1.0" />
        <title>GreenLogic</title>
        <!-- Link to CSS, and .js-->
        <link rel="stylesheet" href="./style.css">
        <script src="app.js" defer></script>
    </head>
    <body> 
        <!-- Header and Brand logo-->
         <header class="page-header">
            <div class="page-header-content">
                <div class="Brand">
                    <span class="brand-icon">🪴</span>
                    <h1>GreenLogic</h1>
                </div>
                <div class="header-stat">
                    Active Lo: <span id="log-count" class="badge-count">0</span>
                </div>
            </div>
         </header>
         <!--Main section-->
         <main class="page-container">
            <!--aside panel-->
            <aside class="panel form-panel">
                <h2 class="panel form-panel">Log Conditions</h2>

                <!--hidden elements-->
                <div
                id="form-error-banner"
                class="alert alert-danger hidden"
                role="alert"
                ></div>
                <!--form-->
                <!--
                    Green House Bay #
                    ---
                    pH Input: unit: unitless 
                    EC Ectrical Conductivity (EC): unit: mS/cm 
                    ---
                    Air Temperature (Temp): unit: degree Celsius or degree Fahrenheit 
                    Relative Humidity (RH): unit: percentage
                    ---
                -->
                <form action="#"  id="greenhouse-form" novalidate>
                    <div class="form-group">
                        <label for="bay-number" class="form-label"
                        >Greenhouse Bay Number<span class="required">*</span></label>
                        <input
                        type="number"
                        name="bay-number"
                        id="bay-number"
                        class="form-control"
                        placeholder="e.g. 1"
                        min="1"
                        max="50"
                        required
                        />
                    </div>
                    <div class="form-group">
                        <label for="pH" class="form-label"
                        >pH <span class="required">*</span></label>
                        <input
                        type="number"
                        name="pH"
                        id="pH"
                        class="form-control"
                        placeholder="e.g. 1"
                        min="0"
                        max="14"
                        required
                        />
                        <label for="EC" class="form-label"
                        >Ectrical Conductivity (EC) (mS/cm)<span class="required">*</span></label>
                        <input
                        type="number"
                        name="EC"
                        id="EC"
                        class="form-control"
                        placeholder="e.g. 1"
                        min="0"
                        max="50" 
                        required
                        />
                        <!-- 50 n=mS/cm is equlivent to sea water-->
                    </div>
                    <div class="form-group">
                        <label for="temp" class="form-label"
                        >Air Temperature (°F) <span class="required">*</span></label>
                        <input
                        type="number"
                        name="temp"
                        id="temp"
                        class="form-control"
                        placeholder="e.g. 70"
                        min="0"
                        max="100"
                        required
                        />
                        <label for="RH" class="form-label"
                        >Relative Humidity (%)<span class="required">*</span></label>
                        <input
                        type="number"
                        name="RH"
                        id="RH"
                        class="form-control"
                        placeholder="e.g. 1"
                        min="0"
                        max="100" 
                        required
                        />
                    </div>
                    <button
                    type="submit"
                    id="btn-submit"
                    class="btn btn-primary btn-block"
                    >Log Data</button>
                </form>

            </aside>
            <!--Right container-->
            <section class="panel record-panel">
                <div class="record-header">
                    <h2 class="panel-title">log</h2>
                    <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
                        Purge Records
                    </button>
                </div>

                <!--Two states-->
                <div id="empty-state" class="empty-state">
                    <span class="empty-icon"></span>
                    <p>No current Records</p>
                </div>
                <ul id="record-list" class="record-grid" aria-live="polite"></ul>
            </section>
         </main>

    </body>

    <footer class="page-footer">
        <p>GreenLogic &copy; 2026 CSI 3150</p>

    </footer>
</html>
